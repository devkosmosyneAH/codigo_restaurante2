<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="La Peña Bar &amp; La Peña Bar & House">
  <meta name="google-site-verification" content="L2Nt7D8o_YPBvbwlY3Uvd9xwYMsNFHDS1ZNVUiO_KCA" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="La Peña">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- CanvasKit se descarga desde Google en el primer acceso. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//www.gstatic.com">

  <title>La Peña • Sistema de Gestión</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-mark">LP</div>
      <div>
        <strong>La Peña</strong>
        <span>Cargando...</span>
      </div>
    </div>
  </div>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fffaf4;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #fffaf4; color: #2b211b; font: 500 16px/1.3 system-ui, sans-serif;
    }
    .boot-card { display: flex; align-items: center; gap: 12px; }
    .boot-mark {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
      background: #7d2d25; color: #fff; font-weight: 800; letter-spacing: .04em;
    }
    .boot-card strong, .boot-card span { display: block; }
    .boot-card span { margin-top: 3px; color: #806f64; font-size: 13px; }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect');
      if (redirect) {
        window.history.replaceState({}, '', redirect);
      }

      var splash = document.getElementById('boot-splash');
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane')) {
          if (splash) splash.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
